<html lang="en">

  <link rel="stylesheet" href="sidepanel.css">

<body>

    </div>
  </div>
  
  <div class="sp-body" id="sp-body">
    <div class="sp-license-gate" id="sp-loading" style="padding:40px 0;text-align:center">
      <p style="color:var(--ql-text-muted)" data-i18n="loading">⏳ Loading...</p>

  </div>

      ◀ Popup
    </button>
    <div class="sp-community">

      </a>
      <a href="https://www.facebook.com/mehanahmed.me" target="_blank" rel="noopener noreferrer" class="sp-social sp-social-fb" title="Visit our Facebook Page" aria-label="Facebook Page">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      </a>
    </div>
    <span class="sp-footer-badge">MiraSoft • v3.8.6</span>
  </div>


  <div class="sp-notif-panel" id="sp-notif-panel" style="display:none">
    <div class="sp-notif-header">
      <span data-i18n="notif.title">Notifications</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <button id="sp-notif-markread" data-i18n-title="notif.markRead" title="Mark all as read" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--ql-text-muted);padding:2px 6px;border-radius:4px;">✓ Read</button>
        <button class="sp-notif-close" id="sp-notif-close">✕</button>
      </div>
    </div>
    <div class="sp-notif-list" id="sp-notif-list">
      <p class="sp-notif-empty" data-i18n="notif.loading">Loading...</p>
    </div>
  </div>

  <script src="net-overrides.js"></script>
  <script src="jszip.min.js"></script>
  <script src="hwFingerprint.js"></script>
  <script src="i18n.js"></script>
  <script src="sidepanel-templates.js"></script>
  <script src="sounds.js"></script>
  <script src="sidepanel.js"></script>
  <script src="branding-overrides.js"></script>
  <script src="reseller-branding.js"></script>
  <script src="gys-overrides.js"></script>
